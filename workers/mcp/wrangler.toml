name = "mcp"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false

# Same zone and host as the contact worker; different path.
[[routes]]
# The trailing * lets URLs with a query string reach the worker, which a pattern without it
# would not match. See the contact worker.
pattern = "api.edmarbarros.com/mcp*"
zone_name = "edmarbarros.com"

[vars]
# Where the static JSON export (src/pages/api) is served from.
SITE_URL = "https://edmarbarros.com"
# Seconds a fetched JSON file stays in the Cloudflare cache.
CACHE_TTL = "300"

# Private link to the contact worker, used by the site_draft_message tool.
# Deploy the contact worker first: this binding needs it to exist.
[[services]]
binding = "CONTACT"
service = "contact"
